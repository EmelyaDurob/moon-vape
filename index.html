<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Moon Vape</title>
<style>
  :root {
    --bg: #05060a;
    --surface: rgba(20, 24, 40, 0.72);
    --surface-solid: #12162a;
    --border: rgba(140, 160, 255, 0.10);
    --border-strong: rgba(140, 160, 255, 0.22);
    --text: #eef1ff;
    --muted: #7c84a8;
    --violet: #8b5cf6;
    --indigo: #6366f1;
    --cyan: #22d3ee;
    --green: #22d3a6;
    --danger: #ff5c7a;
    --radius: 20px;
    --glow-violet: rgba(139, 92, 246, 0.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
    padding-bottom: 120px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
    min-height: 100vh;
  }
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 80% 15%, rgba(200,220,255,0.9), transparent),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 90% 55%, rgba(180,200,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 15% 65%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 45% 10%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 75% 90%, rgba(255,255,255,0.5), transparent);
    animation: twinkle 6s ease-in-out infinite alternate;
    opacity: 0.55;
  }
  @keyframes twinkle { from { opacity: 0.35; } to { opacity: 0.7; } }
  .moon {
    position: fixed; top: -120px; right: -100px; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(200,210,255,0.22), rgba(139,92,246,0.08) 45%, transparent 70%);
    filter: blur(18px); z-index: 0; pointer-events: none;
  }
  .aurora {
    position: fixed; bottom: -200px; left: -100px; right: -100px; height: 460px;
    background:
      radial-gradient(ellipse at 30% 100%, rgba(99,102,241,0.25), transparent 60%),
      radial-gradient(ellipse at 75% 100%, rgba(34,211,238,0.18), transparent 60%);
    filter: blur(40px); z-index: 0; pointer-events: none;
  }
  .header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(5, 6, 10, 0.72);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border-bottom: 1px solid var(--border);
    padding: 18px 18px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    display: flex; align-items: center; gap: 11px;
    font-size: 20px; font-weight: 800; letter-spacing: -0.3px;
  }
  .brand-moon {
    width: 36px; height: 36px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 32% 30%, #e9ecff, #a5b4fc 40%, #6366f1 80%);
    box-shadow: 0 0 20px var(--glow-violet), 0 0 40px rgba(139,92,246,0.25), inset -6px -6px 12px rgba(30,20,70,0.55);
    flex: 0 0 36px;
  }
  .brand-moon::after {
    content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: rgba(120,110,200,0.35); top: 10px; left: 8px;
    box-shadow: 12px 8px 0 -2px rgba(120,110,200,0.28), 4px 18px 0 -3px rgba(120,110,200,0.3);
  }
  .brand-text {
    background: linear-gradient(90deg, #ffffff 20%, #c4b5fd 60%, #67e8f9 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    display: flex; flex-direction: column; line-height: 1.05;
    user-select: none;
  }
  .brand-text small {
    font-size: 9px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    -webkit-text-fill-color: var(--muted); background: none; color: var(--muted); margin-top: 2px;
  }
  .header-cart {
    position: relative; width: 44px; height: 44px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border-strong);
    display: grid; place-items: center; cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .header-cart:active { transform: scale(0.92); border-color: var(--violet); }
  .header-cart svg { width: 20px; height: 20px; stroke: #c9cdf5; fill: none; stroke-width: 1.8; }
  .header-cart .badge {
    position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: linear-gradient(135deg, var(--violet), var(--cyan));
    color: #fff; font-size: 11px; font-weight: 800; display: none;
    align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px var(--bg), 0 0 14px var(--glow-violet);
  }
  .header-cart .badge.show { display: flex; animation: pop 0.3s ease; }
  @keyframes pop { 0%{transform:scale(.5)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .tagline { padding: 22px 20px 6px; position: relative; z-index: 1; }
  .tagline h1 {
    font-size: 26px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15;
    background: linear-gradient(90deg, #ffffff, #b6bdf5 60%, #7dd3fc);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline p { margin-top: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .section-title {
    padding: 22px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 1;
  }
  .section-title span {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--muted);
  }
  .section-title i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); margin-left: 12px; }
  .list { padding: 0 14px; display: grid; gap: 12px; position: relative; z-index: 1; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; display: flex; align-items: center; gap: 14px;
    transition: border-color 0.25s ease, transform 0.15s ease;
    animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    position: relative; overflow: hidden;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180,190,255,0.35), transparent);
  }
  .card:active { transform: scale(0.985); border-color: var(--border-strong); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card-thumb {
    width: 64px; height: 64px; flex: 0 0 64px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(34,211,238,0.14));
    border: 1px solid var(--border-strong);
    overflow: hidden; position: relative;
    display: grid; place-items: center;
    box-shadow: inset 0 0 18px rgba(99,102,241,0.12);
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
  .card-thumb .fallback {
    position: absolute; inset: 0; display: none;
    place-items: center; font-size: 26px;
    background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(34,211,238,0.2));
  }
  .card-thumb .fallback.show { display: grid; }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-size: 15px; font-weight: 700; line-height: 1.3; margin-bottom: 6px;
    color: var(--text); letter-spacing: -0.1px;
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-price {
    font-size: 14px; font-weight: 800;
    background: linear-gradient(90deg, #a5b4fc, #67e8f9);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .add-btn {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 13px;
    border: 1px solid rgba(139,92,246,0.4);
    background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(99,102,241,0.16));
    color: #d5d9ff; font-size: 22px; font-weight: 300;
    display: grid; place-items: center; cursor: pointer; line-height: 1;
    transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .add-btn:active {
    transform: scale(0.88);
    background: linear-gradient(135deg, rgba(139,92,246,0.45), rgba(99,102,241,0.35));
    box-shadow: 0 0 22px var(--glow-violet);
  }
  .cart-bar {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 30;
    background: linear-gradient(135deg, rgba(139,92,246,0.92), rgba(79,70,229,0.92) 55%, rgba(34,211,238,0.85));
    border-radius: 20px; padding: 15px 18px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    box-shadow: 0 16px 40px rgba(99,102,241,0.4), 0 0 0 1px rgba(255,255,255,0.08) inset, 0 0 30px rgba(139,92,246,0.35);
    transform: translateY(140%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
  .cart-bar.show { transform: translateY(0); }
  .cart-bar-left { display: flex; align-items: center; gap: 12px; color: #fff; font-weight: 700; font-size: 15px; }
  .cart-bar-count {
    width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,0.22);
    display: grid; place-items: center; font-size: 13px; font-weight: 800;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .cart-bar-total { color: #fff; font-weight: 800; font-size: 17px; letter-spacing: 0.2px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(2, 3, 8, 0.7);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 40; opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: linear-gradient(180deg, #0e1124, #070915 60%);
    border-radius: 28px 28px 0 0;
    padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 84vh; display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    border-top: 1px solid var(--border-strong);
    box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 42px; height: 4px; border-radius: 2px; background: rgba(180,190,255,0.25);
    margin: 0 auto 16px;
  }
  .sheet-title {
    font-size: 19px; font-weight: 800; margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.3px;
  }
  .sheet-title span {
    background: linear-gradient(90deg, #fff, #b6bdf5);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sheet-clear {
    font-size: 12px; font-weight: 600; color: var(--muted);
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    cursor: pointer; padding: 7px 12px; border-radius: 10px;
    transition: all 0.2s ease;
  }
  .sheet-clear:active { background: rgba(255,70,70,0.12); color: #ff8a8a; border-color: rgba(255,70,70,0.3); }
  .cart-items {
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; gap: 10px; padding-bottom: 14px; flex: 1;
  }
  .cart-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px;
    display: flex; align-items: center; gap: 12px;
    animation: fadeUp 0.3s ease both;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-price { font-size: 12px; color: var(--muted); font-weight: 600; }
  .ci-qty {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 11px; padding: 3px;
  }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 8px; border: 0;
    background: transparent; color: #c9cdf5; font-size: 17px; font-weight: 600;
    display: grid; place-items: center; cursor: pointer;
    transition: background 0.15s ease;
  }
  .qty-btn:active { background: rgba(139,92,246,0.25); }
  .qty-num { min-width: 20px; text-align: center; font-size: 13px; font-weight: 800; }
  .ci-remove {
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid rgba(255,70,70,0.2); background: rgba(255, 70, 70, 0.08);
    color: #ff8080; font-size: 14px; display: grid; place-items: center; cursor: pointer;
  }
  .ci-remove:active { background: rgba(255,70,70,0.22); }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .sheet-footer {
    border-top: 1px solid var(--border); padding-top: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .total-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--muted); margin-bottom: 3px; font-weight: 700;
  }
  .total-value {
    font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #fff, #b6bdf5 60%, #7dd3fc);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .checkout-btn {
    flex: 1; max-width: 200px; height: 54px; border-radius: 16px; border: 0;
    background: linear-gradient(135deg, var(--violet), var(--indigo) 55%, var(--cyan));
    color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 0.2px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(99,102,241,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.12s ease, opacity 0.2s ease;
  }
  .checkout-btn:active { transform: scale(0.96); }
  .checkout-btn:disabled { opacity: 0.4; box-shadow: none; cursor: not-allowed; }
  .footer {
    text-align: center; padding: 30px 20px 10px;
    font-size: 11px; color: rgba(124,132,168,0.5);
    letter-spacing: 1px; position: relative; z-index: 1;
  }
  .admin-entry-wrap {
    padding: 0 20px 30px;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .admin-entry-btn {
    padding: 11px 22px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .admin-entry-btn:active {
    background: rgba(139,92,246,0.1);
    border-color: rgba(139,92,246,0.4);
    color: #c4b5fd;
  }
  .admin-entry-btn .lock-icon { font-size: 14px; opacity: 0.7; }
  .admin-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(2, 3, 8, 0.85);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; align-items: flex-end; justify-content: center;
  }
  .admin-overlay.show { display: flex; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .admin-panel {
    width: 100%; max-width: 520px;
    background: linear-gradient(180deg, #0e1124, #05060a 60%);
    border-radius: 28px 28px 0 0;
    border-top: 1px solid var(--border-strong);
    max-height: 92vh; display: flex; flex-direction: column;
    box-shadow: 0 -30px 80px rgba(0,0,0,0.7);
    animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .admin-header {
    padding: 18px 18px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .admin-title { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }
  .admin-title small {
    display: block; font-size: 10px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase; color: var(--violet); margin-top: 3px;
  }
  .admin-close {
    width: 36px; height: 36px; border-radius: 11px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text); font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
  }
  .admin-close:active { background: rgba(255,255,255,0.1); }
  .admin-status {
    padding: 10px 18px; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
    background: rgba(139,92,246,0.05);
  }
  .admin-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .admin-status.ok .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .admin-status.err .dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
  .admin-status.loading .dot { background: var(--cyan); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .admin-list {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    display: grid; gap: 12px; -webkit-overflow-scrolling: touch;
  }
  .admin-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px;
    display: grid; gap: 8px;
  }
  .admin-item input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-family: inherit;
    outline: none; transition: border-color 0.2s ease;
  }
  .admin-item input:focus { border-color: var(--violet); }
  .admin-item input::placeholder { color: rgba(124,132,168,0.5); }
  .admin-item .row { display: grid; grid-template-columns: 1fr 100px; gap: 8px; }
  .admin-item .img-row { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: center; }
  .admin-item .img-preview {
    width: 48px; height: 48px; border-radius: 10px;
    background: rgba(0,0,0,0.4); border: 1px solid var(--border);
    object-fit: cover; display: block;
  }
  .admin-item .del-btn {
    padding: 8px; border-radius: 9px;
    background: rgba(255,70,70,0.1); border: 1px solid rgba(255,70,70,0.3);
    color: #ff8080; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .admin-item .del-btn:active { background: rgba(255,70,70,0.25); }
  .admin-footer {
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .admin-btn {
    padding: 14px; border-radius: 13px; border: 0;
    font-size: 13px; font-weight: 800; cursor: pointer;
    transition: transform 0.12s ease;
  }
  .admin-btn:active { transform: scale(0.97); }
  .admin-btn.add {
    background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.4);
    color: #c4b5fd;
  }
  .admin-btn.save {
    background: linear-gradient(135deg, var(--violet), var(--indigo));
    color: #fff;
    box-shadow: 0 8px 22px rgba(99,102,241,0.4);
  }
  .admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pw-modal {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(2,3,8,0.9); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .pw-modal.show { display: flex; animation: fadeIn 0.2s ease; }
  .pw-box {
    width: 100%; max-width: 340px;
    background: var(--surface-solid); border: 1px solid var(--border-strong);
    border-radius: 20px; padding: 24px 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  }
  .pw-box h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .pw-box p { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .pw-box input {
    width: 100%; padding: 14px; border-radius: 12px;
    background: rgba(0,0,0,0.4); border: 1px solid var(--border-strong);
    color: var(--text); font-size: 15px; font-family: inherit;
    outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 2px;
  }
  .pw-box input:focus { border-color: var(--violet); }
  .pw-box button {
    width: 100%; padding: 14px; border-radius: 12px; border: 0;
    background: linear-gradient(135deg, var(--violet), var(--indigo));
    color: #fff; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .pw-box button:active { transform: scale(0.97); }
  .pw-error { color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; display: none; }
  .pw-error.show { display: block; }
  .loading-screen {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg); display: grid; place-items: center;
    transition: opacity 0.4s ease;
  }
  .loading-screen.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(139,92,246,0.2);
    border-top-color: var(--violet);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0, 0, 0, 0.9);
    color: #fff;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 9999;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
</div>

<div class="stars"></div>
<div class="moon"></div>
<div class="aurora"></div>

<header class="header">
  <div class="brand">
    <div class="brand-moon"></div>
    <div class="brand-text">
      Moon Vape
      <small>premium shop</small>
    </div>
  </div>
  <div class="header-cart" id="headerCart">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <div class="badge" id="headerBadge">0</div>
  </div>
</header>

<div class="tagline">
  <h1>Твой вкус.<br>Наша луна.</h1>
  <p>Оригинальные девайсы и расходники с доставкой</p>
</div>

<div class="section-title">
  <span>Каталог</span>
  <i></i>
</div>

<main class="list" id="list"></main>

<div class="footer">© MOON VAPE · 2026</div>

<div class="admin-entry-wrap">
  <button class="admin-entry-btn" id="adminEntryBtn">
    <span class="lock-icon">🔐</span>
    <span>Вход в админ-панель</span>
  </button>
</div>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-left">
    <div class="cart-bar-count" id="barCount">0</div>
    <span>Корзина</span>
  </div>
  <div class="cart-bar-total" id="barTotal">0 ₽</div>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span>Корзина</span>
    <button class="sheet-clear" id="clearBtn">Очистить</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="sheet-footer">
    <div>
      <div class="total-label">Итого</div>
      <div class="total-value" id="sheetTotal">0 ₽</div>
    </div>
    <button class="checkout-btn" id="checkoutBtn">Оформить</button>
  </div>
</div>

<div class="pw-modal" id="pwModal">
  <div class="pw-box">
    <h3>🔐 Вход в админку</h3>
    <p>Введите пароль для управления каталогом</p>
    <input type="password" id="pwInput" placeholder="••••" inputmode="numeric" autocomplete="off">
    <button id="pwSubmit">Войти</button>
    <div class="pw-error" id="pwError">Неверный пароль</div>
  </div>
</div>

<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-header">
      <div class="admin-title">
        Админ-панель
        <small>Moon Vape Control</small>
      </div>
      <button class="admin-close" id="adminClose">✕</button>
    </div>
    <div class="admin-status" id="adminStatus">
      <div class="dot"></div>
      <span id="adminStatusText">Проверка подключения...</span>
    </div>
    <div class="admin-list" id="adminList"></div>
    <div class="admin-footer">
      <button class="admin-btn add" id="adminAddBtn">+ Добавить товар</button>
      <button class="admin-btn save" id="adminSaveBtn">💾 Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const FIREBASE_URL = "https://moon-vape-default-rtdb.firebaseio.com/products.json";
  const ADMIN_PASSWORD = "1312";
  const TELEGRAM_USERNAME = "Emelya_1312";

  const DEFAULT_PRODUCTS = [
    { id: 1, name: "XROS Mini", price: 1200, image: "https://picsum.photos/seed/xrosmini/300/300" },
    { id: 2, name: "Картридж XROS 0.6Ω", price: 230, image: "https://picsum.photos/seed/cartridge/300/300" },
    { id: 3, name: "Ашка BOU 600 тяг", price: 150, image: "https://picsum.photos/seed/bou600/300/300" },
    { id: 4, name: "Charon Baby Mystery Box", price: 1000, image: "https://picsum.photos/seed/charon/300/300" },
    { id: 5, name: "Испаритель K5", price: 250, image: "https://picsum.photos/seed/k5coil/300/300" },
    { id: 6, name: "Испаритель B Coil 0.2", price: 250, image: "https://picsum.photos/seed/bcoil/300/300" },
    { id: 7, name: "Бак Hero 2 / Hero 3", price: 450, image: "https://picsum.photos/seed/hero2/300/300" }
  ];

  const CART_KEY = "moon_vape_cart_v1";

  let products = [];
  let cart = loadCart();
  let firebaseReady = false;

  const listEl = document.getElementById("list");
  const cartItemsEl = document.getElementById("cartItems");
  const headerBadge = document.getElementById("headerBadge");
  const barCount = document.getElementById("barCount");
  const barTotal = document.getElementById("barTotal");
  const sheetTotal = document.getElementById("sheetTotal");
  const cartBar = document.getElementById("cartBar");
  const sheet = document.getElementById("sheet");
  const overlay = document.getElementById("overlay");
  const checkoutBtn = document.getElementById("checkoutBtn");
  const clearBtn = document.getElementById("clearBtn");
  const headerCart = document.getElementById("headerCart");
  const loadingScreen = document.getElementById("loadingScreen");
  const toast = document.getElementById("toast");

  const pwModal = document.getElementById("pwModal");
  const pwInput = document.getElementById("pwInput");
  const pwSubmit = document.getElementById("pwSubmit");
  const pwError = document.getElementById("pwError");

  const adminOverlay = document.getElementById("adminOverlay");
  const adminList = document.getElementById("adminList");
  const adminClose = document.getElementById("adminClose");
  const adminAddBtn = document.getElementById("adminAddBtn");
  const adminSaveBtn = document.getElementById("adminSaveBtn");
  const adminStatus = document.getElementById("adminStatus");
  const adminStatusText = document.getElementById("adminStatusText");
  const adminEntryBtn = document.getElementById("adminEntryBtn");

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  function formatPrice(n) {
    return Number(n).toLocaleString("ru-RU") + " ₽";
  }

  function loadCart() {
    try {
      const raw = localStorage.getItem(CART_KEY);
      if (!raw) return {};
      const p = JSON.parse(raw);
      return typeof p === "object" && p ? p : {};
    } catch { return {}; }
  }

  function saveCart() {
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch {}
  }

  function cartCount() {
    return Object.values(cart).reduce((a, b) => a + b, 0);
  }

  function cartTotal() {
    return Object.entries(cart).reduce((s, [id, qty]) => {
      const p = products.find(x => Number(x.id) === Number(id));
      return s + (p ? Number(p.price) * qty : 0);
    }, 0);
  }

  function normalizeProducts(obj) {
    if (!obj) return null;
    const arr = Object.values(obj).filter(Boolean);
    if (!arr.length) return null;
    return arr.map(p => ({
      id: Number(p.id),
      name: String(p.name || ""),
      price: Number(p.price) || 0,
      image: String(p.image || "")
    })).sort((a, b) => a.id - b.id);
  }

  function productsToObject(arr) {
    const obj = {};
    arr.forEach(p => { obj[String(p.id)] = p; });
    return obj;
  }

  async function loadProducts() {
    try {
      const resp = await fetch(FIREBASE_URL + "?ts=" + Date.now());
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      const normalized = normalizeProducts(data);
      if (normalized) {
        products = normalized;
        firebaseReady = true;
      } else {
        products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
        firebaseReady = true;
      }
    } catch (e) {
      console.error("Ошибка загрузки Firebase:", e);
      firebaseReady = false;
      products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
    }
  }

  async function saveProductsToFirebase(arr) {
    const resp = await fetch(FIREBASE_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(productsToObject(arr))
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    return await resp.json();
  }

  function renderProducts() {
    listEl.innerHTML = "";
    if (!products.length) {
      listEl.innerHTML = `<div class="empty"><div class="empty-icon">🌙</div>Каталог пуст</div>`;
      return;
    }
    products.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (i * 0.05) + "s";
      card.innerHTML = `
        <div class="card-thumb">
          <img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.classList.add('show')">
          <div class="fallback">💨</div>
        </div>
        <div class="card-info">
          <div class="card-name">${p.name}</div>
          <div class="card-price">${formatPrice(p.price)}</div>
        </div>
        <button class="add-btn" data-id="${p.id}" aria-label="Добавить">+</button>
      `;
      listEl.appendChild(card);
    });
    listEl.querySelectorAll(".add-btn").forEach(btn => {
      btn.addEventListener("click", () => addToCart(Number(btn.dataset.id)));
    });
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    saveCart();
    renderCart();
    renderSummary();
    bumpCart();
  }
  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id] += delta;
    if (cart[id] <= 0) delete cart[id];
    saveCart();
    renderCart();
    renderSummary();
  }
  function removeItem(id) {
    delete cart[id];
    saveCart();
    renderCart();
    renderSummary();
  }
  function clearCart() {
    cart = {};
    saveCart();
    renderCart();
    renderSummary();
  }
  function bumpCart() {
    cartBar.style.transition = "transform 0.15s ease";
    cartBar.style.transform = "translateY(-4px)";
    setTimeout(() => { cartBar.style.transform = ""; cartBar.style.transition = ""; }, 160);
  }

  function renderCart() {
    const entries = Object.entries(cart);
    cartItemsEl.innerHTML = "";
    if (!entries.length) {
      cartItemsEl.innerHTML = `<div class="empty"><div class="empty-icon">🌙</div>Здесь пока пусто</div>`;
      return;
    }
    entries.forEach(([id, qty]) => {
      const p = products.find(x => Number(x.id) === Number(id));
      if (!p) return;
      const item = document.createElement("div");
      item.className = "cart-item";
      item.innerHTML = `
        <div class="ci-info">
          <div class="ci-name">${p.name}</div>
          <div class="ci-price">${formatPrice(p.price)} × ${qty}</div>
        </div>
        <div class="ci-qty">
          <button class="qty-btn" data-action="minus" data-id="${p.id}">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" data-action="plus" data-id="${p.id}">+</button>
        </div>
        <button class="ci-remove" data-action="remove" data-id="${p.id}">✕</button>
      `;
      cartItemsEl.appendChild(item);
    });
    cartItemsEl.querySelectorAll("button[data-action]").forEach(btn => {
      const id = Number(btn.dataset.id);
      const action = btn.dataset.action;
      btn.addEventListener("click", () => {
        if (action === "plus") changeQty(id, 1);
        else if (action === "minus") changeQty(id, -1);
        else if (action === "remove") removeItem(id);
      });
    });
  }

  function renderSummary() {
    const count = cartCount();
    const total = cartTotal();
    headerBadge.textContent = count;
    headerBadge.classList.toggle("show", count > 0);
    barCount.textContent = count;
    barTotal.textContent = formatPrice(total);
    sheetTotal.textContent = formatPrice(total);
    cartBar.classList.toggle("show", count > 0);
    checkoutBtn.disabled = count === 0;
    checkoutBtn.textContent = count === 0 ? "Оформить" : `Оформить · ${formatPrice(total)}`;
    checkoutBtn.style.maxWidth = "230px";
  }

  function openSheet() {
    if (cartCount() === 0) return;
    overlay.classList.add("show");
    sheet.classList.add("show");
  }
  function closeSheet() {
    overlay.classList.remove("show");
    sheet.classList.remove("show");
  }

  function buildOrderText() {
    const lines = ["🌙 Новый заказ Moon Vape", ""];
    Object.entries(cart).forEach(([id, qty]) => {
      const p = products.find(x => Number(x.id) === Number(id));
      if (!p) return;
      const sum = Number(p.price) * qty;
      lines.push(`• ${p.name} × ${qty} — ${sum.toLocaleString("ru-RU")} ₽`);
    });
    lines.push("");
    lines.push(`💰 Итого: ${cartTotal().toLocaleString("ru-RU")} ₽`);
    return lines.join("\n");
  }

  function sendOrderToTelegram() {
    const text = buildOrderText();
    const encoded = encodeURIComponent(text);

    showToast("Открываю Telegram...");

    const nativeUrl = `tg://resolve?domain=${TELEGRAM_USERNAME}&text=${encoded}`;
    const webUrl = `https://t.me/${TELEGRAM_USERNAME}?text=${encoded}`;
    const shareUrl = `https://t.me/share/url?url=&text=${encoded}`;

    window.location.href = nativeUrl;

    const timeout = setTimeout(() => {
      window.location.href = webUrl;
      setTimeout(() => {
        if (document.visibilityState === "visible") {
          window.open(shareUrl, "_blank");
        }
      }, 2000);
    }, 1500);

    document.addEventListener("visibilitychange", function onVis() {
      if (document.visibilityState === "visible") {
        clearTimeout(timeout);
        document.removeEventListener("visibilitychange", onVis);
      }
    });

    setTimeout(() => {
      clearCart();
      closeSheet();
    }, 600);
  }

  adminEntryBtn.addEventListener("click", () => {
    pwInput.value = "";
    pwError.classList.remove("show");
    pwModal.classList.add("show");
    setTimeout(() => pwInput.focus(), 100);
  });

  pwSubmit.addEventListener("click", tryAdminLogin);
  pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryAdminLogin(); });

  function tryAdminLogin() {
    if (pwInput.value.trim() === ADMIN_PASSWORD) {
      pwModal.classList.remove("show");
      openAdmin();
    } else {
      pwError.classList.add("show");
      pwInput.value = "";
      pwInput.focus();
    }
  }
  pwModal.addEventListener("click", (e) => {
    if (e.target === pwModal) pwModal.classList.remove("show");
  });

  let editingProducts = [];

  function openAdmin() {
    editingProducts = JSON.parse(JSON.stringify(products));
    renderAdminList();
    checkFirebaseStatus();
    adminOverlay.classList.add("show");
  }

  function closeAdmin() {
    adminOverlay.classList.remove("show");
  }

  function updateAdminStatus(state, text) {
    adminStatus.classList.remove("ok", "err", "loading");
    if (state) adminStatus.classList.add(state);
    adminStatusText.textContent = text || "";
  }

  function checkFirebaseStatus() {
    if (firebaseReady) {
      updateAdminStatus("ok", "✓ Синхронизация с Firebase активна");
    } else {
      updateAdminStatus("err", "✗ Ошибка подключения к Firebase");
    }
  }

  function renderAdminList() {
    adminList.innerHTML = "";
    if (!editingProducts.length) {
      adminList.innerHTML = `<div class="empty" style="padding:20px;font-size:13px;">Нет товаров. Добавьте первый.</div>`;
      return;
    }
    editingProducts.forEach((p, idx) => {
      const item = document.createElement("div");
      item.className = "admin-item";
      item.innerHTML = `
        <div class="img-row">
          <img class="img-preview" src="${p.image}" alt="" onerror="this.style.opacity='0.3'">
          <input type="text" placeholder="URL картинки" value="${p.image || ''}" data-field="image" data-idx="${idx}">
        </div>
        <input type="text" placeholder="Название товара" value="${p.name || ''}" data-field="name" data-idx="${idx}">
        <div class="row">
          <input type="number" placeholder="Цена, ₽" value="${p.price || 0}" data-field="price" data-idx="${idx}">
          <button class="del-btn" data-del="${idx}">Удалить</button>
        </div>
      `;
      adminList.appendChild(item);
    });

    adminList.querySelectorAll("input[data-field]").forEach(inp => {
      inp.addEventListener("input", (e) => {
        const idx = Number(e.target.dataset.idx);
        const field = e.target.dataset.field;
        if (field === "price") editingProducts[idx].price = Number(e.target.value) || 0;
        else editingProducts[idx][field] = e.target.value;
        if (field === "image") {
          const prev = e.target.closest(".admin-item").querySelector(".img-preview");
          prev.src = e.target.value;
          prev.style.opacity = "1";
        }
      });
    });

    adminList.querySelectorAll("button[data-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.del);
        editingProducts.splice(idx, 1);
        renderAdminList();
      });
    });
  }

  adminAddBtn.addEventListener("click", () => {
    const newId = editingProducts.length
      ? Math.max(...editingProducts.map(p => Number(p.id))) + 1
      : 1;
    editingProducts.push({
      id: newId,
      name: "Новый товар",
      price: 0,
      image: "https://picsum.photos/seed/newitem" + newId + "/300/300"
    });
    renderAdminList();
    adminList.scrollTop = adminList.scrollHeight;
  });

  adminSaveBtn.addEventListener("click", async () => {
    adminSaveBtn.disabled = true;
    adminSaveBtn.textContent = "Сохранение...";
    updateAdminStatus("loading", "Отправка данных в Firebase...");

    try {
      await saveProductsToFirebase(editingProducts);
      products = JSON.parse(JSON.stringify(editingProducts));
      firebaseReady = true;
      renderProducts();
      renderCart();
      renderSummary();
      updateAdminStatus("ok", "✓ Сохранено. Все клиенты увидят обновление");
      adminSaveBtn.textContent = "✓ Сохранено";
      setTimeout(() => {
        adminSaveBtn.disabled = false;
        adminSaveBtn.textContent = "💾 Сохранить";
      }, 1800);
    } catch (e) {
      console.error(e);
      updateAdminStatus("err", "✗ Ошибка: " + e.message);
      adminSaveBtn.disabled = false;
      adminSaveBtn.textContent = "💾 Сохранить";
    }
  });

  adminClose.addEventListener("click", closeAdmin);
  adminOverlay.addEventListener("click", (e) => {
    if (e.target === adminOverlay) closeAdmin();
  });

  async function refreshCatalogIfVisible() {
    if (document.visibilityState !== "visible") return;
    if (adminOverlay.classList.contains("show")) return;
    const before = JSON.stringify(products);
    await loadProducts();
    if (JSON.stringify(products) !== before) {
      renderProducts();
      renderCart();
      renderSummary();
    }
  }

  document.addEventListener("visibilitychange", refreshCatalogIfVisible);
  setInterval(refreshCatalogIfVisible, 60000);

  cartBar.addEventListener("click", openSheet);
  headerCart.addEventListener("click", openSheet);
  overlay.addEventListener("click", closeSheet);
  clearBtn.addEventListener("click", clearCart);
  checkoutBtn.addEventListener("click", () => {
    if (cartCount() === 0) return;
    sendOrderToTelegram();
  });

  let startY = 0, currentY = 0, dragging = false;
  sheet.addEventListener("touchstart", (e) => {
    if (e.target.closest(".cart-items")) return;
    startY = e.touches[0].clientY;
    dragging = true;
    sheet.style.transition = "none";
  }, { passive: true });
  sheet.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    currentY = e.touches[0].clientY;
    sheet.style.transform = `translateY(${Math.max(0, currentY - startY)}px)`;
  }, { passive: true });
  sheet.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = "";
    if (Math.max(0, currentY - startY) > 90) {
      sheet.style.transform = "";
      closeSheet();
    } else {
      sheet.style.transform = "";
    }
  });

  (async () => {
    await loadProducts();
    renderProducts();
    renderCart();
    renderSummary();
    setTimeout(() => loadingScreen.classList.add("hide"), 300);
  })();
</script>

</body>
</html>
